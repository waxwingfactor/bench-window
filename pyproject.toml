[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-window"
version = "1.0.0"
description = "Offline timing feasibility and replanning for small manual lab runs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "waxwingfactor"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering"]

[project.urls]
Repository = "https://github.com/waxwingfactor/bench-window"
Issues = "https://github.com/waxwingfactor/bench-window/issues"

[project.scripts]
bench-window = "bench_window.cli:main"

[tool.setuptools.packages.find]
include = ["bench_window*"]

[tool.setuptools.package-data]
bench_window = ["data/*.json"]
